
---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: secureblue-niridux
description: Secureblue with Niri and Dux

base-image: ghcr.io/secureblue/silverblue-main-hardened
image-version: 44


modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        enable:
          - name: avengemedia/danklinux
            chroot: fedora-44-x86_64
          - name: avengemedia/dms
            chroot: fedora-44-x86_64
          - name: wezfurlong/wezterm-nightly
            chroot: fedora-44-x86_64
    install:
      packages:
        - niri
        - quickshell-git
        - greetd
        - wezterm
        - cliphist
        - wl-clipboard
        - cava
        - dms
        - dms-greeter
        - dgop
        - danksearch
        - dankcalendar
        - dux-files
        - matugen
        - qt6-qtmultimedia
        - accountsservice
        - i2c-tools
        - acl
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - gnome-keyring
        - policycoreutils-python-utils
    remove:
      auto-remove: true
      packages:
        - gdm
        - gnome-shell
        - gnome-shell-common
        - gnome-shell-extension-common
        - gnome-shell-extension-apps-menu
        - gnome-shell-extension-launch-new-instance
        - gnome-shell-extension-places-menu
        - gnome-shell-extension-window-list
        - gnome-session
        - gnome-session-wayland-session
        - gnome-classic-session
        - mutter
        - mutter-common
        - gnome-settings-daemon
        - gnome-control-center
        - gnome-control-center-filesystem
        - gnome-initial-setup
        - nautilus
        - nautilus-extensions
        - papers-nautilus
        - ptyxis
        - gnome-browser-connector
        - gnome-disk-utility
        - gnome-system-monitor
        - gnome-tweaks
        - gnome-color-manager
        - gnome-bluetooth
        - gnome-user-docs
        - gnome-app-list
        - alacritty

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      - semanage fcontext -m -t cache_home_t '/var/cache/dms-greeter(/.*)?' || semanage fcontext -a -t cache_home_t '/var/cache/dms-greeter(/.*)?'
      - test -f /usr/lib/systemd/user/dms.service
      - test -f /usr/lib/systemd/user/niri.service
      - mkdir -p /usr/lib/systemd/user/niri.service.wants
      - ln -sfn ../dms.service /usr/lib/systemd/user/niri.service.wants/dms.service

  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: signing
