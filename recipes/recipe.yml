
---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: secureblue-niridux
description: Secureblue with Niri and Dux

base-image: ghcr.io/secureblue/silverblue-main-hardened
image-version: 45


modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        enable:
          - name: duxlabs/dux-repo
            chroot: fedora-45-x86_64
          - name: duxlabs/dms-git
            chroot: fedora-45-x86_64
          - name: lionheartp/Hyprland
            chroot: fedora-45-x86_64
          - name: wezfurlong/wezterm-nightly
            chroot: fedora-45-x86_64
    install:
      packages:
        - niri
        - quickshell-git
        - wezterm
        - dms
        - dux-greeter
        - dux-gop
        - dux-files
        - cliphist
        - wl-clipboard
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - hyprland
        - hyprland-guiutils
        - xdg-desktop-portal-hyprland
    remove:
      auto-remove: true
      packages:
        - gdm
        - gnome-shell
        - gnome-shell-common
        - gnome-shell-extension-common
        - gnome-shell-extension-apps-menu
        - gnome-shell-extension-launch-new-instance
        - gnome-shell-extension-places-menu
        - gnome-shell-extension-window-list
        - gnome-session
        - gnome-session-wayland-session
        - gnome-classic-session
        - mutter
        - mutter-common
        - gnome-settings-daemon
        - gnome-control-center
        - gnome-control-center-filesystem
        - gnome-initial-setup
        - nautilus
        - nautilus-extensions
        - papers-nautilus
        - ptyxis
        - gnome-browser-connector
        - gnome-disk-utility
        - gnome-system-monitor
        - gnome-tweaks
        - gnome-color-manager
        - gnome-bluetooth
        - gnome-user-docs
        - gnome-app-list
        - alacritty
        - gnome-keyring

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      - test -f /usr/lib/systemd/user/dms.service
      - test -f /usr/lib/systemd/user/niri.service
      - mkdir -p /usr/lib/systemd/user/niri.service.wants
      - ln -sfn ../dms.service /usr/lib/systemd/user/niri.service.wants/dms.service

  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: signing
